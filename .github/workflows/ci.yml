name: CI

on:
  pull_request:
    branches: [main, production]

jobs:
  backend-qa:
    name: Backend QA & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enforce No Forbidden Root Folders
        run: |
          VIOLATIONS=0

          if [ -d ".vscode" ]; then
            echo "::error file=.vscode,title=Forbidden Root Folder::'.vscode' must not be committed."
            VIOLATIONS=1
          fi

          if [ -d "public" ]; then
            echo "::error file=public,title=Forbidden Root Folder::'public' must not exist at the repository root."
            VIOLATIONS=1
          fi

          if [ $VIOLATIONS -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-pnpm

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Drizzle Schema Verification
        run: pnpm drizzle-kit check

      - name: Run Domain & Unit Tests
        run: pnpm test

      - name: Build Dual-Target Application
        run: pnpm build
