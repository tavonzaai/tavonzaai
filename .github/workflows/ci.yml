name: CI

on:
  pull_request:
    branches: [main, prod, dev]
  push:
    branches: [main, prod, dev]

jobs:
  # ─── Step 1: Security & Root Hygiene Scan (Mandatory First Gate) ────────────
  security-scan:
    name: Security & Root Scan
    uses: ./.github/workflows/security-scan.yml

  # ─── Step 2: Detect which parts of the repo actually changed ────────────────
  changes:
    name: Detect Changes
    needs: [security-scan]
    runs-on: ubuntu-latest
    outputs:
      packages:                ${{ steps.filter.outputs.packages }}
      api:                     ${{ steps.filter.outputs.api }}
      ai:                      ${{ steps.filter.outputs.ai }}
      realtime:                ${{ steps.filter.outputs.realtime }}
      worker:                  ${{ steps.filter.outputs.worker }}
      frontend-admin:          ${{ steps.filter.outputs.frontend-admin }}
      frontend-customer:       ${{ steps.filter.outputs.frontend-customer }}
      frontend-staff:          ${{ steps.filter.outputs.frontend-staff }}
      frontend-branch-manager: ${{ steps.filter.outputs.frontend-branch-manager }}
      frontend-cashier:        ${{ steps.filter.outputs.frontend-cashier }}
      frontend-kitchen:        ${{ steps.filter.outputs.frontend-kitchen }}
      ci-config:               ${{ steps.filter.outputs.ci-config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
            api:
              - 'apps/api/**'
              - 'packages/**'
            ai:
              - 'apps/ai/**'
              - 'packages/**'
            realtime:
              - 'apps/realtime/**'
              - 'packages/**'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
            frontend-admin:
              - 'frontend/admin/**'
              - 'packages/contracts/**'
              - 'packages/shared/**'
            frontend-customer:
              - 'frontend/customer/**'
              - 'packages/contracts/**'
              - 'packages/shared/**'
            frontend-staff:
              - 'frontend/staff/**'
              - 'packages/contracts/**'
              - 'packages/shared/**'
            frontend-branch-manager:
              - 'frontend/branch-manager/**'
              - 'packages/contracts/**'
              - 'packages/shared/**'
            frontend-cashier:
              - 'frontend/cashier/**'
              - 'packages/contracts/**'
              - 'packages/shared/**'
            frontend-kitchen:
              - 'frontend/kitchen/**'
              - 'packages/contracts/**'
              - 'packages/shared/**'
            ci-config:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'turbo.json'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'

  # ─── Step 3: Typecheck Backend Apps & Workers ───────────────────────────────
  typecheck-apps:
    name: "Typecheck › ${{ matrix.pkg.name }}"
    needs: [security-scan, changes]
    if: needs.changes.outputs[matrix.pkg.id] == 'true' || needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - { id: 'api', name: 'API (@tavonza/api)', filter: '@tavonza/api' }
          - { id: 'realtime', name: 'Realtime (@tavonza/realtime)', filter: '@tavonza/realtime' }
          - { id: 'worker', name: 'Worker (@tavonza/worker)', filter: '@tavonza/worker' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Build shared dependencies
        run: pnpm turbo run build --filter=${{ matrix.pkg.filter }}^...
      - name: Run Typecheck
        run: pnpm turbo run typecheck --filter=${{ matrix.pkg.filter }}

  # ─── Step 4: Typecheck Frontend Applications ────────────────────────────────
  typecheck-frontends:
    name: "Typecheck › ${{ matrix.app.name }}"
    needs: [security-scan, changes]
    if: needs.changes.outputs[matrix.app.id] == 'true' || needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { id: 'frontend-admin', name: 'Admin', filter: '@frontend/admin' }
          - { id: 'frontend-customer', name: 'Customer', filter: '@frontend/customer' }
          - { id: 'frontend-staff', name: 'Staff', filter: '@frontend/staff' }
          - { id: 'frontend-branch-manager', name: 'Branch Manager', filter: '@frontend/branch-manager' }
          - { id: 'frontend-cashier', name: 'Cashier', filter: '@frontend/cashier' }
          - { id: 'frontend-kitchen', name: 'Kitchen', filter: '@frontend/kitchen' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Build shared dependencies
        run: pnpm turbo run build --filter=${{ matrix.app.filter }}^...
      - name: Run Typecheck
        run: pnpm turbo run typecheck --filter=${{ matrix.app.filter }}

  # ─── Step 5: Unit & Integration Tests ────────────────────────────────────────
  test-api:
    name: "Tests › API"
    needs: [security-scan, changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Build shared dependencies
        run: pnpm turbo run build --filter=@tavonza/api^...
      - name: Run API Tests
        run: pnpm turbo run test --filter=@tavonza/api
