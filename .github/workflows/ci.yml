name: CI

on:
  pull_request:
    branches: [main, prod, feature/backend-standalone]
  push:
    branches: [main, prod, feature/backend-standalone]

jobs:
  # ─── Step 1: Security & Root Hygiene Scan ───────────────────────────────────
  security-scan:
    name: Security & Root Scan
    uses: ./.github/workflows/security-scan.yml

  # ─── Step 2: Quality Gates (Typecheck, Schema Check, Tests & Build) ─────────
  backend-qa:
    name: Backend QA & Build
    needs: [security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-pnpm

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Drizzle Schema Verification
        run: pnpm drizzle-kit check
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/platform_dev"

      - name: Run Domain & Unit Tests
        run: pnpm test

      - name: Build Dual-Target Application
        run: pnpm build
