name: Deploy (Live Environment)

# Triggers automatically when code is merged into the 'main' branch.
# 'main' is the actual live environment without prefixes (*.tavonza.com).
# Only battle-tested code from 'prod' is promoted here.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  security-scan:
    name: Pre-Deployment Security Scan
    uses: ./.github/workflows/security-scan.yml

  deploy-production:
    name: Build & Deploy to Production
    needs: [security-scan]
    runs-on: ubuntu-latest
