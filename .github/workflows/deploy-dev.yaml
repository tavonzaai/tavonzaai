name: Deploy (Dev Environment)

on:
  push:
    branches:
      - main
      - feature/backend-standalone
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ─── 1. Build and Push Docker Images ───────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner
        id: repo-owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-dev-api:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-dev-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-dev-worker:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-dev-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 2. Deploy to Dev Server ───────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Restart Backend Services via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER != '' && secrets.USER || 'admin' }}
          key: ${{ secrets.KEY }}
          envs: GH_ACTOR,GH_TOKEN
          script_stop: true
          script: |
            cd /home/admin/server

            echo "🔑 Authenticating with GitHub Container Registry..."
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "⬇️ Pulling latest backend images (api & worker)..."
            docker compose -f docker-compose.dev.yaml pull api worker

            echo "▶️ Restarting backend containers..."
            docker compose -f docker-compose.dev.yaml up -d api worker

            echo "🧹 Cleaning up old dangling images..."
            docker image prune -f

            echo "✅ Backend deployment complete! Status:"
            docker compose -f docker-compose.dev.yaml ps api worker
