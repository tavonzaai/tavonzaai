name: Deploy (Dev Environment)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build and deploy"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - api
          - worker
          - realtime
          - ai
          - customer
          - admin
          - kitchen
          - cashier
          - manager
          - waiter

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─── 1. Detect Changes ──────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      realtime: ${{ steps.filter.outputs.realtime }}
      ai: ${{ steps.filter.outputs.ai }}
      customer: ${{ steps.filter.outputs.customer }}
      admin: ${{ steps.filter.outputs.admin }}
      kitchen: ${{ steps.filter.outputs.kitchen }}
      cashier: ${{ steps.filter.outputs.cashier }}
      manager: ${{ steps.filter.outputs.manager }}
      waiter: ${{ steps.filter.outputs.waiter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'docker/api.Dockerfile'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'docker/worker.Dockerfile'
            realtime:
              - 'apps/realtime/**'
              - 'packages/**'
              - 'docker/realtime.Dockerfile'
            ai:
              - 'apps/ai/**'
              - 'docker/ai.Dockerfile'
            customer:
              - 'frontend/customer/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'
            admin:
              - 'frontend/admin/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'
            kitchen:
              - 'frontend/kitchen/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'
            cashier:
              - 'frontend/cashier/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'
            manager:
              - 'frontend/manager/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'
            waiter:
              - 'frontend/waiter/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'

  # ─── 2. Build & Push Images in Parallel ─────────────────────────────────────
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    needs: [detect-changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: docker/api.Dockerfile
            image_name: tavonzaai-dev-api
            build_args: ""
            changed_key: api
          - service: worker
            dockerfile: docker/worker.Dockerfile
            image_name: tavonzaai-dev-worker
            build_args: ""
            changed_key: worker
          - service: realtime
            dockerfile: docker/realtime.Dockerfile
            image_name: tavonzaai-dev-realtime
            build_args: ""
            changed_key: realtime
          - service: ai
            dockerfile: docker/ai.Dockerfile
            image_name: tavonzaai-dev-ai
            build_args: ""
            changed_key: ai
          - service: customer
            dockerfile: docker/frontend-app.Dockerfile
            image_name: tavonzaai-dev-customer
            build_args: |
              APP_NAME=customer
              APP_PORT=3000
            changed_key: customer
          - service: admin
            dockerfile: docker/frontend-app.Dockerfile
            image_name: tavonzaai-dev-admin
            build_args: |
              APP_NAME=admin
              APP_PORT=3043
            changed_key: admin
          - service: kitchen
            dockerfile: docker/frontend-app.Dockerfile
            image_name: tavonzaai-dev-kitchen
            build_args: |
              APP_NAME=kitchen
              APP_PORT=3105
            changed_key: kitchen
          - service: cashier
            dockerfile: docker/frontend-app.Dockerfile
            image_name: tavonzaai-dev-cashier
            build_args: |
              APP_NAME=cashier
              APP_PORT=3104
            changed_key: cashier
          - service: manager
            dockerfile: docker/frontend-app.Dockerfile
            image_name: tavonzaai-dev-manager
            build_args: |
              APP_NAME=manager
              APP_PORT=3103
            changed_key: manager
          - service: waiter
            dockerfile: docker/frontend-app.Dockerfile
            image_name: tavonzaai-dev-waiter
            build_args: |
              APP_NAME=waiter
              APP_PORT=3101
            changed_key: waiter
    steps:
      - name: Check if build needed
        id: check
        env:
          SERVICE: ${{ matrix.service }}
          CHANGED_KEY: ${{ matrix.changed_key }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          API_CHANGED: ${{ needs.detect-changes.outputs.api }}
          WORKER_CHANGED: ${{ needs.detect-changes.outputs.worker }}
          REALTIME_CHANGED: ${{ needs.detect-changes.outputs.realtime }}
          AI_CHANGED: ${{ needs.detect-changes.outputs.ai }}
          CUSTOMER_CHANGED: ${{ needs.detect-changes.outputs.customer }}
          ADMIN_CHANGED: ${{ needs.detect-changes.outputs.admin }}
          KITCHEN_CHANGED: ${{ needs.detect-changes.outputs.kitchen }}
          CASHIER_CHANGED: ${{ needs.detect-changes.outputs.cashier }}
          MANAGER_CHANGED: ${{ needs.detect-changes.outputs.manager }}
          WAITER_CHANGED: ${{ needs.detect-changes.outputs.waiter }}
        run: |
          SHOULD_BUILD="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_SERVICE" = "all" ] || [ "$INPUT_SERVICE" = "$SERVICE" ]; then
              SHOULD_BUILD="true"
            fi
          else
            case "$SERVICE" in
              api)      [ "$API_CHANGED"      = "true" ] && SHOULD_BUILD="true" ;;
              worker)   [ "$WORKER_CHANGED"   = "true" ] && SHOULD_BUILD="true" ;;
              realtime) [ "$REALTIME_CHANGED" = "true" ] && SHOULD_BUILD="true" ;;
              ai)       [ "$AI_CHANGED"       = "true" ] && SHOULD_BUILD="true" ;;
              customer) [ "$CUSTOMER_CHANGED" = "true" ] && SHOULD_BUILD="true" ;;
              admin)    [ "$ADMIN_CHANGED"    = "true" ] && SHOULD_BUILD="true" ;;
              kitchen)  [ "$KITCHEN_CHANGED"  = "true" ] && SHOULD_BUILD="true" ;;
              cashier)  [ "$CASHIER_CHANGED"  = "true" ] && SHOULD_BUILD="true" ;;
              manager)  [ "$MANAGER_CHANGED"  = "true" ] && SHOULD_BUILD="true" ;;
              waiter)   [ "$WAITER_CHANGED"   = "true" ] && SHOULD_BUILD="true" ;;
            esac
          fi
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "$SERVICE -> build required: $SHOULD_BUILD"

      - uses: actions/checkout@v4
        if: steps.check.outputs.should_build == 'true'

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner
        if: steps.check.outputs.should_build == 'true'
        id: repo-owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push Image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/${{ matrix.image_name }}:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/${{ matrix.image_name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Tavonza AI Dev ${{ matrix.service }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Deploy via SSH to /home/admin/server ──────────────────────────────
  deploy:
    name: Deploy to Server (/home/admin/server)
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@v4

      - name: Determine Services to Update
        id: target-services
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          EVENT_NAME: ${{ github.event_name }}
          API_CHANGED: ${{ needs.detect-changes.outputs.api }}
          WORKER_CHANGED: ${{ needs.detect-changes.outputs.worker }}
          REALTIME_CHANGED: ${{ needs.detect-changes.outputs.realtime }}
          AI_CHANGED: ${{ needs.detect-changes.outputs.ai }}
          CUSTOMER_CHANGED: ${{ needs.detect-changes.outputs.customer }}
          ADMIN_CHANGED: ${{ needs.detect-changes.outputs.admin }}
          KITCHEN_CHANGED: ${{ needs.detect-changes.outputs.kitchen }}
          CASHIER_CHANGED: ${{ needs.detect-changes.outputs.cashier }}
          MANAGER_CHANGED: ${{ needs.detect-changes.outputs.manager }}
          WAITER_CHANGED: ${{ needs.detect-changes.outputs.waiter }}
        run: |
          SERVICES=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_SERVICE" = "all" ]; then
              SERVICES="api worker realtime ai customer admin kitchen cashier manager waiter"
            else
              SERVICES="$INPUT_SERVICE"
            fi
          else
            [ "$API_CHANGED"      = "true" ] && SERVICES="$SERVICES api"
            [ "$WORKER_CHANGED"   = "true" ] && SERVICES="$SERVICES worker"
            [ "$REALTIME_CHANGED" = "true" ] && SERVICES="$SERVICES realtime"
            [ "$AI_CHANGED"       = "true" ] && SERVICES="$SERVICES ai"
            [ "$CUSTOMER_CHANGED" = "true" ] && SERVICES="$SERVICES customer"
            [ "$ADMIN_CHANGED"    = "true" ] && SERVICES="$SERVICES admin"
            [ "$KITCHEN_CHANGED"  = "true" ] && SERVICES="$SERVICES kitchen"
            [ "$CASHIER_CHANGED"  = "true" ] && SERVICES="$SERVICES cashier"
            [ "$MANAGER_CHANGED"  = "true" ] && SERVICES="$SERVICES manager"
            [ "$WAITER_CHANGED"   = "true" ] && SERVICES="$SERVICES waiter"
          fi

          # Trim leading/trailing whitespace
          SERVICES=$(echo "$SERVICES" | xargs)
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Services to update: $SERVICES"

      - name: Copy Docker Configs to Server
        if: steps.target-services.outputs.services != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER != '' && secrets.USER || 'admin' }}
          key: ${{ secrets.KEY }}
          source: "docker/docker-compose.dev.yaml,docker/Caddyfile"
          target: "/home/admin/server"
          strip_components: 1

      - name: Deploy Services via SSH
        if: steps.target-services.outputs.services != ''
        uses: appleboy/ssh-action@v1
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICES: ${{ steps.target-services.outputs.services }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER != '' && secrets.USER || 'admin' }}
          key: ${{ secrets.KEY }}
          envs: GH_ACTOR,GH_TOKEN,SERVICES
          script_stop: true
          script: |
            cd /home/admin/server
            [ -f .env ] || touch .env

            # Authenticate with GitHub Container Registry
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Ensure core services (PostgreSQL, Redis, Caddy) are running
            docker compose -f docker-compose.dev.yaml up -d postgres redis caddy

            # Stop and remove updated services
            echo "🛑 Stopping updated services: $SERVICES"
            docker compose -f docker-compose.dev.yaml stop $SERVICES 2>/dev/null || true
            docker compose -f docker-compose.dev.yaml rm -f $SERVICES 2>/dev/null || true

            # Pull latest container images
            echo "⬇️ Pulling latest images for: $SERVICES"
            docker compose -f docker-compose.dev.yaml pull $SERVICES

            # Launch updated services
            echo "▶️ Launching updated services: $SERVICES"
            docker compose -f docker-compose.dev.yaml up -d --no-build $SERVICES

            # Prune dangling images to conserve disk space
            docker image prune -f 2>/dev/null || true
            echo "✅ Deployment completed successfully for: $SERVICES"
