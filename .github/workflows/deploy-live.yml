name: Deploy (Live Production Environment)

# Manual deployment workflow via workflow_dispatch.
# Finds EC2 instances by tag, pulls the new Docker image from GHCR, and restarts containers via AWS SSM.

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - backend
          - worker
          - customer
          - admin
          - kitchen
          - cashier
          - manager
          - branch-manager
          - waiter

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AWS_REGION: eu-west-2
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tavonzaai

jobs:
  # ─── 1. Deploy Backend ──────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (api.tavonza.com)
    if: inputs.service == 'all' || inputs.service == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tavonzaai-live-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/tavonzaai-live-backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tavonzaai/tavonzaai
            org.opencontainers.image.description=Tavonza AI Live Backend API
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=tavonzaai-live-backend" "Name=instance-state-name,Values=running" \
            --region ${{ env.AWS_REGION }} \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          echo "Instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --region ${{ env.AWS_REGION }} \
            --parameters 'commands=[
              "docker system prune -af --volumes=false 2>/dev/null || true",
              "docker pull ghcr.io/tavonzaai/tavonzaai-live-backend:latest",
              "docker stop tavonzaai-backend 2>/dev/null || true",
              "docker rm tavonzaai-backend 2>/dev/null || true",
              "docker run -d --name tavonzaai-backend --restart always --log-opt max-size=20m --log-opt max-file=3 --env-file /opt/tavonzaai/backend.env -p 5000:5000 ghcr.io/tavonzaai/tavonzaai-live-backend:latest",
              "docker image prune -af 2>/dev/null || true"
            ]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} || {
            echo "::error::SSM command failed. Fetching execution details..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query "{Status: Status, Output: StandardOutputContent, Error: StandardErrorContent}"
            exit 1
          }
          echo "✅ Backend deployed!"

  # ─── 2. Deploy Worker ────────────────────────────────────────────────────────
  deploy-worker:
    name: Deploy Worker (email/outbox/notifications)
    needs: [deploy-backend]
    if: always() && (inputs.service == 'all' || inputs.service == 'backend' || inputs.service == 'worker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tavonzaai-live-worker:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/tavonzaai-live-worker:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tavonzaai/tavonzaai
            org.opencontainers.image.description=Tavonza AI Live Worker
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Worker to EC2 via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=tavonzaai-live-backend" "Name=instance-state-name,Values=running" \
            --region ${{ env.AWS_REGION }} \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          echo "Instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --region ${{ env.AWS_REGION }} \
            --parameters 'commands=[
              "docker system prune -af --volumes=false 2>/dev/null || true",
              "docker pull ghcr.io/tavonzaai/tavonzaai-live-worker:latest",
              "docker stop tavonzaai-worker 2>/dev/null || true",
              "docker rm tavonzaai-worker 2>/dev/null || true",
              "docker run -d --name tavonzaai-worker --restart always --log-opt max-size=20m --log-opt max-file=3 --env-file /opt/tavonzaai/backend.env ghcr.io/tavonzaai/tavonzaai-live-worker:latest",
              "docker image prune -af 2>/dev/null || true"
            ]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} || {
            echo "::error::SSM command failed. Fetching execution details..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query "{Status: Status, Output: StandardOutputContent, Error: StandardErrorContent}"
            exit 1
          }
          echo "✅ Worker deployed!"

  # ─── 3. Deploy Frontend Apps ─────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (${{ matrix.app }})
    if: inputs.service != 'backend' && inputs.service != 'worker'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            ecr_name: frontend
            container: tavonzaai-customer
            port: 3000
          - app: admin
            ecr_name: admin-dashboard
            container: tavonzaai-admin
            port: 3043
          - app: kitchen
            ecr_name: kitchen
            container: tavonzaai-kitchen
            port: 3105
          - app: cashier
            ecr_name: cashier
            container: tavonzaai-cashier
            port: 3104
          - app: manager
            ecr_name: manager
            container: tavonzaai-manager
            port: 3103
          - app: waiter
            ecr_name: waiter
            container: tavonzaai-waiter
            port: 3101
    steps:
      - name: Check if deploy needed
        id: check
        run: |
          SHOULD_DEPLOY="false"
          if [ "${{ inputs.service }}" = "all" ] || [ "${{ inputs.service }}" = "${{ matrix.app }}" ] || [ "${{ inputs.service }}" = "branch-manager" -a "${{ matrix.app }}" = "manager" ]; then
            SHOULD_DEPLOY="true"
          fi
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "${{ matrix.app }} -> deploy: $SHOULD_DEPLOY"

      - uses: actions/checkout@v4
        if: steps.check.outputs.should_deploy == 'true'

      - name: Configure AWS Credentials
        if: steps.check.outputs.should_deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.should_deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Image
        if: steps.check.outputs.should_deploy == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend-app.Dockerfile
          build-args: |
            APP_NAME=${{ matrix.app }}
            APP_PORT=${{ matrix.port }}
            NEXT_PUBLIC_API_URL=https://api.tavonza.com
            NEXT_PUBLIC_AI_API_URL=https://ai.tavonza.com
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tavonzaai-live-${{ matrix.ecr_name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/tavonzaai-live-${{ matrix.ecr_name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tavonzaai/tavonzaai
            org.opencontainers.image.description=Tavonza AI Live Frontend (${{ matrix.app }})
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        if: steps.check.outputs.should_deploy == 'true'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/tavonzaai-live-${{ matrix.ecr_name }}:latest
          CONTAINER: ${{ matrix.container }}
          PORT: ${{ matrix.port }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=tavonzaai-live-frontend" "Name=instance-state-name,Values=running" \
            --region ${{ env.AWS_REGION }} \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          echo "Instance: $INSTANCE_ID  App: ${{ matrix.app }}  Port: $PORT"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --region ${{ env.AWS_REGION }} \
            --parameters "commands=[
              \"docker pull $IMAGE\",
              \"docker stop $CONTAINER 2>/dev/null || true\",
              \"docker rm $CONTAINER 2>/dev/null || true\",
              \"docker run -d --name $CONTAINER --restart always --log-opt max-size=20m --log-opt max-file=3 -e NODE_ENV=production -e PORT=$PORT -e NEXT_PUBLIC_API_URL=https://api.tavonza.com -e API_BASE_URL=https://api.tavonza.com -e NEXT_PUBLIC_AI_API_URL=https://ai.tavonza.com -p $PORT:$PORT $IMAGE\",
              \"docker image prune -f 2>/dev/null || true\"
            ]" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} || {
            echo "::error::SSM command failed. Fetching execution details..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query "{Status: Status, Output: StandardOutputContent, Error: StandardErrorContent}"
            exit 1
          }
          echo "✅ ${{ matrix.app }} deployed on port $PORT!"
