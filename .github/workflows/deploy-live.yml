name: Deploy (Live Production Environment)

# Automatically fires ONLY when code is merged / pushed to the 'main' branch.
# Deploys to the actual production live environment (*.tavonza.com).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - backend
          - customer
          - admin
          - kitchen
          - cashier
          - branch-manager
          - waiter

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ENVIRONMENT: live
  BACKEND_INSTANCE_NAME: tavonzaai-live-backend
  FRONTEND_INSTANCE_NAME: tavonzaai-live-frontend

jobs:
  # ─── 1. Security Scan Gate ──────────────────────────────────────────────────
  security-scan:
    name: Security & Root Scan
    uses: ./.github/workflows/security-scan.yml

  # ─── 2. Detect Changes ──────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Microservices
    needs: [security-scan]
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      customer: ${{ steps.filter.outputs.customer }}
      admin: ${{ steps.filter.outputs.admin }}
      kitchen: ${{ steps.filter.outputs.kitchen }}
      cashier: ${{ steps.filter.outputs.cashier }}
      branch-manager: ${{ steps.filter.outputs.branch-manager }}
      waiter: ${{ steps.filter.outputs.waiter }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'packages/**'
              - 'docker/api.Dockerfile'
            customer:
              - 'frontend/customer/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'
            admin:
              - 'frontend/admin/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'
            kitchen:
              - 'frontend/kitchen/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'
            cashier:
              - 'frontend/cashier/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'
            branch-manager:
              - 'frontend/branch-manager/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'
            waiter:
              - 'frontend/waiter/**'
              - 'packages/**'
              - 'docker/frontend*.Dockerfile'

  # ─── 3. Build & Deploy Backend API ──────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend API (api.tavonza.com)
    needs: [detect-changes]
    if: |
      (github.event_name == 'push' && (needs.detect-changes.outputs.backend == 'true')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'backend'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/tavonzaai-live-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/tavonzaai-live-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Backend EC2 via AWS SSM
        run: |
          echo "Finding running backend instance tagged Name=${{ env.BACKEND_INSTANCE_NAME }}..."
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.BACKEND_INSTANCE_NAME }}" "Name=instance-state-name,Values=running" \
            --region ${{ env.AWS_REGION }} \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Error: Backend EC2 instance not found or not in running state."
            exit 1
          fi

          echo "Target Instance ID: $INSTANCE_ID"
          echo "Triggering SSM Run Command for container deployment..."

          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE="${REGISTRY}/tavonzaai-live-backend:latest"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy tavonzaai-live-backend container" \
            --parameters "{\"commands\":[
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $IMAGE\",
              \"docker stop tavonzaai-backend 2>/dev/null || true\",
              \"docker rm tavonzaai-backend 2>/dev/null || true\",
              \"docker run -d --name tavonzaai-backend --restart always -p 5000:5000 -e NODE_ENV=production -e PORT=5000 $IMAGE\"
            ]}" \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "Command sent successfully (CommandId: $COMMAND_ID). Waiting for completion..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region ${{ env.AWS_REGION }}
          echo "Backend deployment completed successfully!"

  # ─── 4. Build & Deploy Frontend Applications ────────────────────────────────
  deploy-frontend-apps:
    name: Deploy Frontend (${{ matrix.app }})
    needs: [detect-changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            ecr_name: frontend
            port: 3000
            container: tavonzaai-customer
            subdomain: "tavonza.com"
          - app: admin
            ecr_name: admin-dashboard
            port: 3043
            container: tavonzaai-admin
            subdomain: "admin.tavonza.com"
          - app: kitchen
            ecr_name: kitchen
            port: 3105
            container: tavonzaai-kitchen
            subdomain: "kitchen.tavonza.com"
          - app: cashier
            ecr_name: cashier
            port: 3104
            container: tavonzaai-cashier
            subdomain: "cashier.tavonza.com"
          - app: branch-manager
            ecr_name: branch-manager
            port: 3103
            container: tavonzaai-branch-manager
            subdomain: "branch-manager.tavonza.com"
          - app: waiter
            ecr_name: waiter
            port: 3101
            container: tavonzaai-waiter
            subdomain: "waiter.tavonza.com"
    if: |
      (github.event_name == 'push' && (needs.detect-changes.outputs[matrix.app] == 'true')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == matrix.app))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend-app.Dockerfile
          build-args: |
            APP_NAME=${{ matrix.app }}
            APP_PORT=${{ matrix.port }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/tavonzaai-live-${{ matrix.ecr_name }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/tavonzaai-live-${{ matrix.ecr_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Container to Frontend EC2 via AWS SSM
        run: |
          echo "Finding running frontend instance tagged Name=${{ env.FRONTEND_INSTANCE_NAME }}..."
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.FRONTEND_INSTANCE_NAME }}" "Name=instance-state-name,Values=running" \
            --region ${{ env.AWS_REGION }} \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Error: Frontend EC2 instance not found or not in running state."
            exit 1
          fi

          echo "Target Instance ID: $INSTANCE_ID"
          echo "Deploying ${{ matrix.app }} container to port ${{ matrix.port }}..."

          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE="${REGISTRY}/tavonzaai-live-${{ matrix.ecr_name }}:latest"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ matrix.container }} container" \
            --parameters "{\"commands\":[
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $IMAGE\",
              \"docker stop ${{ matrix.container }} 2>/dev/null || true\",
              \"docker rm ${{ matrix.container }} 2>/dev/null || true\",
              \"docker run -d --name ${{ matrix.container }} --restart always -p ${{ matrix.port }}:${{ matrix.port }} -e NODE_ENV=production -e PORT=${{ matrix.port }} $IMAGE\"
            ]}" \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "Command sent successfully (CommandId: $COMMAND_ID). Waiting for completion..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region ${{ env.AWS_REGION }}
          echo "${{ matrix.app }} deployed successfully on port ${{ matrix.port }} (${{ matrix.subdomain }})!"
