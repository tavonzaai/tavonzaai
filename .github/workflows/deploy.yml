name: Deploy (Production)

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner
        id: repo-owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-api:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-worker:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production Server
    if: github.ref == 'refs/heads/production'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Docker Compose & Caddyfile to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER != '' && secrets.USER || 'admin' }}
          key: ${{ secrets.KEY }}
          source: "docker/docker-compose.dev.yaml,docker/Caddyfile"
          target: "/home/admin/server"
          strip_components: 1

      - name: Deploy Backend Services via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER != '' && secrets.USER || 'admin' }}
          key: ${{ secrets.KEY }}
          envs: GH_ACTOR,GH_TOKEN,IMAGE_OWNER,IMAGE_SHA
          script_stop: true
          script: |
            cd /home/admin/server

            # Ensure shared Docker network exists
            docker network create tavonza-net 2>/dev/null || true

            OWNER=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
            API_IMAGE="ghcr.io/${OWNER}/tavonzaai-api:${IMAGE_SHA}"
            WORKER_IMAGE="ghcr.io/${OWNER}/tavonzaai-worker:${IMAGE_SHA}"

            echo "Authenticating with GitHub Container Registry..."
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            cat > docker-compose.deploy.yaml <<EOF
            services:
              api:
                image: ${API_IMAGE}
              worker:
                image: ${WORKER_IMAGE}
            EOF

            echo "Pulling ${API_IMAGE} and ${WORKER_IMAGE}..."
            docker compose -f docker-compose.dev.yaml -f docker-compose.deploy.yaml pull api worker

            echo "Restarting backend containers..."
            docker compose -f docker-compose.dev.yaml -f docker-compose.deploy.yaml up -d --no-build api worker

            echo "Ensuring Caddy reverse proxy is running..."
            docker compose -f docker-compose.dev.yaml up -d caddy

            echo "Waiting for readiness..."
            for i in 1 2 3 4 5 6; do
              if curl -sSf http://localhost:5000/health/readiness; then
                echo "Readiness check passed."
                break
              fi
              if [ "$i" -eq 6 ]; then
                echo "Readiness check failed after 6 attempts."
                exit 1
              fi
              sleep 5
            done

            echo "Cleaning up dangling Docker images..."
            docker image prune -f

            echo "Production deployment complete. Current status:"
            docker compose -f docker-compose.dev.yaml -f docker-compose.deploy.yaml ps api worker
