name: Deploy (Production)

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ─── 1. Quality Gates (Tests, Typecheck, Schema Check & Build) ───────────────
  quality-gates:
    name: Quality Gates & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-pnpm

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Drizzle Schema Verification
        run: pnpm drizzle-kit check
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/platform_dev"

      - name: Run Domain & Unit Tests
        run: pnpm test

      - name: Build Dual-Target Application
        run: pnpm build

  # ─── 2. Build & Push Production Docker Images ───────────────────────────────
  build-and-push:
    name: Build & Push Images
    needs: [quality-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner
        id: repo-owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-dev-api:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-dev-api:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-api:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-dev-worker:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-dev-worker:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-worker:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tavonzaai-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Rolling Restart on Production Server via SSH ────────────────────────
  deploy:
    name: Deploy to Production Server
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend Services via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER != '' && secrets.USER || 'admin' }}
          key: ${{ secrets.KEY }}
          envs: GH_ACTOR,GH_TOKEN
          script_stop: true
          script: |
            cd /home/admin/server

            echo "🔑 Authenticating with GitHub Container Registry..."
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "⬇️ Pulling latest backend images..."
            docker compose -f docker-compose.dev.yaml pull api worker

            echo "▶️ Performing rolling restart on backend containers..."
            docker compose -f docker-compose.dev.yaml up -d api worker

            echo "🩺 Verifying container health..."
            sleep 5
            curl -sSf http://localhost:5000/health/readiness || true

            echo "🧹 Cleaning up old dangling Docker images..."
            docker image prune -f

            echo "✅ Production deployment complete! Current status:"
            docker compose -f docker-compose.dev.yaml ps api worker
