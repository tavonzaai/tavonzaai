name: Deploy (Dev Environment)

# Automatically triggers on push to the 'dev' branch, or manually via workflow_dispatch.
# Builds changed container images, pushes to Amazon ECR, and deploys to Amazon ECS.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, backend, frontend, admin)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - admin

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECS_CLUSTER: tavonzaai-dev-cluster

jobs:
  # ─── 1. Detect Changes ────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin:    ${{ steps.filter.outputs.admin }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'packages/**'
              - 'docker/api.Dockerfile'
            frontend:
              - 'frontend/customer/**'
              - 'packages/**'
              - 'docker/frontend.Dockerfile'
            admin:
              - 'frontend/admin/**'
              - 'packages/**'
              - 'docker/admin.Dockerfile'

  # ─── 2. Build & Deploy Backend API ───────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend API
    needs: [detect-changes]
    if: |
      github.event_name == 'push' && (needs.detect-changes.outputs.backend == 'true') ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'backend')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/tavonzaai-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/tavonzaai-dev-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/tavonzaai-dev-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to ECS (Rolling Update)
        run: |
          echo "Triggering zero-downtime deployment for backend service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service tavonzaai-dev-backend \
            --force-new-deployment

  # ─── 3. Build & Deploy Frontend (Customer App) ──────────────────────────────
  deploy-frontend:
    name: Deploy Customer Frontend
    needs: [detect-changes]
    if: |
      github.event_name == 'push' && (needs.detect-changes.outputs.frontend == 'true') ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'frontend')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/tavonzaai-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/tavonzaai-dev-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/tavonzaai-dev-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to ECS (Rolling Update)
        run: |
          echo "Triggering zero-downtime deployment for frontend service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service tavonzaai-dev-frontend \
            --force-new-deployment

  # ─── 4. Build & Deploy Admin Dashboard ──────────────────────────────────────
  deploy-admin:
    name: Deploy Admin Dashboard
    needs: [detect-changes]
    if: |
      github.event_name == 'push' && (needs.detect-changes.outputs.admin == 'true') ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'admin')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/tavonzaai-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/admin.Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/tavonzaai-dev-admin-dashboard:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/tavonzaai-dev-admin-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to ECS (Rolling Update)
        run: |
          echo "Triggering zero-downtime deployment for admin dashboard service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service tavonzaai-dev-admin \
            --force-new-deployment
