name: Deploy (Prod Environment - Testable)

# Triggers automatically when code is merged into the 'prod' branch.
# This deploys to the testable prod environment (prod-*.tavonza.com)
# before promotion to the live environment ('main' branch).

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  security-scan:
    name: Pre-Deployment Security Scan
    uses: ./.github/workflows/security-scan.yml

  deploy-preprod:
    name: Build & Deploy to Pre-Production
    needs: [security-scan]
    runs-on: ubuntu-latest
    steps:
