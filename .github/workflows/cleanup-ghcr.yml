name: Cleanup Old GHCR Images

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 3 AM UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup-images:
    name: Prune Old GHCR Image Versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - tavonzaai-live-backend
          - tavonzaai-live-worker
          - tavonzaai-live-frontend
          - tavonzaai-live-admin-dashboard
          - tavonzaai-live-kitchen
          - tavonzaai-live-cashier
          - tavonzaai-live-manager
          - tavonzaai-live-waiter
    steps:
      - name: Delete old versions for ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: 'false'
        continue-on-error: true
