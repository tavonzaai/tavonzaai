name: Cleanup Old GHCR Images

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 3 AM UTC
  workflow_dispatch:
    inputs:
      dev_api:
        description: Delete tavonzaai-dev-api
        required: false
        type: boolean
        default: true
      dev_customer:
        description: Delete tavonzaai-dev-customer
        required: false
        type: boolean
        default: true
      dev_manager:
        description: Delete tavonzaai-dev-manager
        required: false
        type: boolean
        default: true
      dev_kitchen:
        description: Delete tavonzaai-dev-kitchen
        required: false
        type: boolean
        default: true
      dev_realtime:
        description: Delete tavonzaai-dev-realtime
        required: false
        type: boolean
        default: true
      dev_worker:
        description: Delete tavonzaai-dev-worker
        required: false
        type: boolean
        default: true
      dev_ai:
        description: Delete tavonzaai-dev-ai
        required: false
        type: boolean
        default: true
      dev_waiter:
        description: Delete tavonzaai-dev-waiter
        required: false
        type: boolean
        default: true
      dev_cashier:
        description: Delete tavonzaai-dev-cashier
        required: false
        type: boolean
        default: true
      dev_admin:
        description: Delete tavonzaai-dev-admin
        required: false
        type: boolean
        default: true
      live_ai:
        description: Delete tavonzaai-live-ai
        required: false
        type: boolean
        default: true
      live_admin_dashboard:
        description: Delete tavonzaai-live-admin-dashboard
        required: false
        type: boolean
        default: true
      live_worker:
        description: Delete tavonzaai-live-worker
        required: false
        type: boolean
        default: true
      live_kitchen:
        description: Delete tavonzaai-live-kitchen
        required: false
        type: boolean
        default: true
      live_realtime:
        description: Delete tavonzaai-live-realtime
        required: false
        type: boolean
        default: true
      live_manager:
        description: Delete tavonzaai-live-manager
        required: false
        type: boolean
        default: true
      live_backend:
        description: Delete tavonzaai-live-backend
        required: false
        type: boolean
        default: true
      live_cashier:
        description: Delete tavonzaai-live-cashier
        required: false
        type: boolean
        default: true
      live_waiter:
        description: Delete tavonzaai-live-waiter
        required: false
        type: boolean
        default: true
      live_frontend:
        description: Delete tavonzaai-live-frontend
        required: false
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  select-packages:
    name: Select packages to delete
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.selection.outputs.packages }}
      has-packages: ${{ steps.selection.outputs.has-packages }}
    steps:
      - name: Build package selection
        id: selection
        env:
          DEV_API: ${{ github.event_name == 'schedule' || inputs.dev_api }}
          DEV_CUSTOMER: ${{ github.event_name == 'schedule' || inputs.dev_customer }}
          DEV_MANAGER: ${{ github.event_name == 'schedule' || inputs.dev_manager }}
          DEV_KITCHEN: ${{ github.event_name == 'schedule' || inputs.dev_kitchen }}
          DEV_REALTIME: ${{ github.event_name == 'schedule' || inputs.dev_realtime }}
          DEV_WORKER: ${{ github.event_name == 'schedule' || inputs.dev_worker }}
          DEV_AI: ${{ github.event_name == 'schedule' || inputs.dev_ai }}
          DEV_WAITER: ${{ github.event_name == 'schedule' || inputs.dev_waiter }}
          DEV_CASHIER: ${{ github.event_name == 'schedule' || inputs.dev_cashier }}
          DEV_ADMIN: ${{ github.event_name == 'schedule' || inputs.dev_admin }}
          LIVE_AI: ${{ github.event_name == 'schedule' || inputs.live_ai }}
          LIVE_ADMIN_DASHBOARD: ${{ github.event_name == 'schedule' || inputs.live_admin_dashboard }}
          LIVE_WORKER: ${{ github.event_name == 'schedule' || inputs.live_worker }}
          LIVE_KITCHEN: ${{ github.event_name == 'schedule' || inputs.live_kitchen }}
          LIVE_REALTIME: ${{ github.event_name == 'schedule' || inputs.live_realtime }}
          LIVE_MANAGER: ${{ github.event_name == 'schedule' || inputs.live_manager }}
          LIVE_BACKEND: ${{ github.event_name == 'schedule' || inputs.live_backend }}
          LIVE_CASHIER: ${{ github.event_name == 'schedule' || inputs.live_cashier }}
          LIVE_WAITER: ${{ github.event_name == 'schedule' || inputs.live_waiter }}
          LIVE_FRONTEND: ${{ github.event_name == 'schedule' || inputs.live_frontend }}
        run: |
          packages=()
          [[ "$DEV_API" == "true" ]] && packages+=('"tavonzaai-dev-api"')
          [[ "$DEV_CUSTOMER" == "true" ]] && packages+=('"tavonzaai-dev-customer"')
          [[ "$DEV_MANAGER" == "true" ]] && packages+=('"tavonzaai-dev-manager"')
          [[ "$DEV_KITCHEN" == "true" ]] && packages+=('"tavonzaai-dev-kitchen"')
          [[ "$DEV_REALTIME" == "true" ]] && packages+=('"tavonzaai-dev-realtime"')
          [[ "$DEV_WORKER" == "true" ]] && packages+=('"tavonzaai-dev-worker"')
          [[ "$DEV_AI" == "true" ]] && packages+=('"tavonzaai-dev-ai"')
          [[ "$DEV_WAITER" == "true" ]] && packages+=('"tavonzaai-dev-waiter"')
          [[ "$DEV_CASHIER" == "true" ]] && packages+=('"tavonzaai-dev-cashier"')
          [[ "$DEV_ADMIN" == "true" ]] && packages+=('"tavonzaai-dev-admin"')
          [[ "$LIVE_AI" == "true" ]] && packages+=('"tavonzaai-live-ai"')
          [[ "$LIVE_ADMIN_DASHBOARD" == "true" ]] && packages+=('"tavonzaai-live-admin-dashboard"')
          [[ "$LIVE_WORKER" == "true" ]] && packages+=('"tavonzaai-live-worker"')
          [[ "$LIVE_KITCHEN" == "true" ]] && packages+=('"tavonzaai-live-kitchen"')
          [[ "$LIVE_REALTIME" == "true" ]] && packages+=('"tavonzaai-live-realtime"')
          [[ "$LIVE_MANAGER" == "true" ]] && packages+=('"tavonzaai-live-manager"')
          [[ "$LIVE_BACKEND" == "true" ]] && packages+=('"tavonzaai-live-backend"')
          [[ "$LIVE_CASHIER" == "true" ]] && packages+=('"tavonzaai-live-cashier"')
          [[ "$LIVE_WAITER" == "true" ]] && packages+=('"tavonzaai-live-waiter"')
          [[ "$LIVE_FRONTEND" == "true" ]] && packages+=('"tavonzaai-live-frontend"')

          if ((${#packages[@]} == 0)); then
            echo 'packages=[]' >> "$GITHUB_OUTPUT"
            echo 'has-packages=false' >> "$GITHUB_OUTPUT"
            echo 'No packages selected; cleanup will be skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'packages=[%s]\n' "$(IFS=,; echo "${packages[*]}")" >> "$GITHUB_OUTPUT"
            echo 'has-packages=true' >> "$GITHUB_OUTPUT"
          fi

  cleanup-images:
    name: Prune Old GHCR Image Versions
    needs: select-packages
    if: needs.select-packages.outputs.has-packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select-packages.outputs.packages) }}
    steps:
      - name: Delete old versions for ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'false'
        continue-on-error: true
