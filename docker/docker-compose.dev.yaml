services:
  # ─── 1. Core Data Stores ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tavonzaai-dev-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-platform_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-platform_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tavonzaai-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─── 2. Backend Platform Applications ─────────────────────────────────────
  api:
    image: ${IMAGE_PREFIX:-ghcr.io/tavonzaai}/tavonzaai-dev-api:latest
    container_name: tavonzaai-dev-api
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "5000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-platform_dev}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/tavonzaai}/tavonzaai-dev-worker:latest
    container_name: tavonzaai-dev-worker
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-platform_dev}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  realtime:
    image: ${IMAGE_PREFIX:-ghcr.io/tavonzaai}/tavonzaai-dev-realtime:latest
    container_name: tavonzaai-dev-realtime
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/realtime.Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      REALTIME_PORT: 3001
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  ai:
    image: ${IMAGE_PREFIX:-ghcr.io/tavonzaai}/tavonzaai-dev-ai:latest
    container_name: tavonzaai-dev-ai
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/ai.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AI_SERVICE_PORT: 8000
      INTERNAL_API_BASE_URL: http://api:3000/internal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  # ─── 3. Frontend Applications ─────────────────────────────────────────────
  customer:
    image: ${IMAGE_PREFIX:-ghcr.io/tavonzaai}/tavonzaai-dev-customer:latest
    container_name: tavonzaai-dev-customer
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/frontend-app.Dockerfile
      args:
        APP_NAME: customer
        APP_PORT: 3000
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
    depends_on:
      api:
        condition: service_started

  admin:
    image: ${IMAGE_PREFIX:-ghcr.io/tavonzaai}/tavonzaai-dev-admin:latest
    container_name: tavonzaai-dev-admin
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/frontend-app.Dockerfile
      args:
        APP_NAME: admin
        APP_PORT: 3043
    ports:
      - "3043:3043"
    env_file:
      - .env
    environment:
      PORT: 3043
    depends_on:
      api:
        condition: service_started

  kitchen:
    image: ${IMAGE_PREFIX:-ghcr.io/tavonzaai}/tavonzaai-dev-kitchen:latest
    container_name: tavonzaai-dev-kitchen
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/frontend-app.Dockerfile
      args:
        APP_NAME: kitchen
        APP_PORT: 3105
    ports:
      - "3105:3105"
    env_file:
      - .env
    environment:
      PORT: 3105
    depends_on:
      api:
        condition: service_started

  cashier:
    image: ${IMAGE_PREFIX:-ghcr.io/tavonzaai}/tavonzaai-dev-cashier:latest
    container_name: tavonzaai-dev-cashier
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/frontend-app.Dockerfile
      args:
        APP_NAME: cashier
        APP_PORT: 3104
    ports:
      - "3104:3104"
    env_file:
      - .env
    environment:
      PORT: 3104
    depends_on:
      api:
        condition: service_started

  manager:
    image: ${IMAGE_PREFIX:-ghcr.io/tavonzaai}/tavonzaai-dev-manager:latest
    container_name: tavonzaai-dev-manager
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/frontend-app.Dockerfile
      args:
        APP_NAME: manager
        APP_PORT: 3103
    ports:
      - "3103:3103"
    env_file:
      - .env
    environment:
      PORT: 3103
    depends_on:
      api:
        condition: service_started

  waiter:
    image: ${IMAGE_PREFIX:-ghcr.io/tavonzaai}/tavonzaai-dev-waiter:latest
    container_name: tavonzaai-dev-waiter
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/frontend-app.Dockerfile
      args:
        APP_NAME: waiter
        APP_PORT: 3101
    ports:
      - "3101:3101"
    env_file:
      - .env
    environment:
      PORT: 3101
    depends_on:
      api:
        condition: service_started

  # ─── 4. Reverse Proxy & SSL ───────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: tavonzaai-dev-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
      - caddy_dev_config:/config
    env_file:
      - .env
    depends_on:
      - api
      - customer

volumes:
  postgres_dev_data:
    name: tavonzaai_postgres_dev_data
  redis_dev_data:
    name: tavonzaai_redis_dev_data
  caddy_dev_data:
    name: tavonzaai_caddy_dev_data
  caddy_dev_config:
    name: tavonzaai_caddy_dev_config

networks:
  default:
    name: tavonzaai_dev_network
