services:
  # ─── 1. Web API & Socket.IO Gateway ─────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    container_name: tavonza-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      PORT: 3000
      API_PORT: 3000

  # ─── 2. Background Queue & Outbox Worker ────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    container_name: tavonza-worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - api

  # ─── 3. Reverse Proxy & SSL ─────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: tavonza-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
      - caddy_dev_config:/config
    env_file:
      - ../.env
    depends_on:
      - api

volumes:
  caddy_dev_data:
    name: tavonza_caddy_dev_data
  caddy_dev_config:
    name: tavonza_caddy_dev_config

networks:
  default:
    name: tavonza_dev_network
